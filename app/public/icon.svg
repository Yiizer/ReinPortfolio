      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#06b6d4" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Badge Container (Matching Loading Screen Surface) -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="#131316" stroke="#27272a" stroke-width="1.2" />
  
  <!-- Ambient Cyan Inner Glow -->
  <rect x="2" y="2" width="28" height="28" rx="6.5" fill="#06b6d4" fill-opacity="0.08" />

  <!-- 4 Technical Corner Brackets: ┌ ┐ └ ┘ -->
