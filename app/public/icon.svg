  <path d="M10 10.5 H15.8 C17.8 10.5 19.2 11.7 19.2 13.5 C19.2 14.8 18.2 15.9 16.8 16.3 L19.8 21.5 H17.1 L14.3 16.8 H12.2 V21.5 H10 Z M12.2 12.3 V15.0 H15.4 C16.5 15.0 17.1 14.4 17.1 13.6 C17.1 12.8 16.5 12.3 15.4 12.3 Z" fill="#ffffff" />

